<div class="login-root">

  <!-- ── Brand header ── -->
  <div class="login-brand">
    <div class="login-logo"><mat-icon>precision_manufacturing</mat-icon></div>
    <div class="login-brand-text">
      <span class="login-brand-name">Agro-Tech Demonstrator</span>
      <span class="login-brand-sub">INTELLIGENT QUALITY CONTROL</span>
    </div>
  </div>

  <!-- ── Reset card ── -->
  <div class="login-card">

    <div class="login-card-header">
      <h2>Reset Password</h2>
      <p>Enter your email and choose a new password</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">

      <div class="login-field">
        <label class="login-label">Email</label>
        <div class="login-input-wrap" [class.input-error]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched">
          <mat-icon class="input-icon">alternate_email</mat-icon>
          <input class="login-input" type="email" formControlName="email" autocomplete="email">
        </div>
        <span class="login-error" *ngIf="resetForm.get('email')?.hasError('required') && resetForm.get('email')?.touched">
          Email is required
        </span>
        <span class="login-error" *ngIf="resetForm.get('email')?.hasError('email') && resetForm.get('email')?.touched">
          Invalid email address
        </span>
      </div>

      <div class="login-field">
        <label class="login-label">New Password</label>
        <div class="login-input-wrap" [class.input-error]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
          <mat-icon class="input-icon">lock_outline</mat-icon>
          <input class="login-input" [type]="hidePassword ? 'password' : 'text'"
                 formControlName="newPassword" autocomplete="new-password">
          <button type="button" class="toggle-pw" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <span class="login-error" *ngIf="resetForm.get('newPassword')?.hasError('required') && resetForm.get('newPassword')?.touched">
          Password is required
        </span>
        <span class="login-error" *ngIf="resetForm.get('newPassword')?.hasError('minlength') && resetForm.get('newPassword')?.touched">
          Password must be at least 6 characters
        </span>
      </div>

      <button class="login-btn" type="submit" [disabled]="resetForm.invalid || loading">
        <mat-icon *ngIf="!loading">lock_reset</mat-icon>
        <span class="login-spinner" *ngIf="loading"></span>
        {{ loading ? 'Resetting…' : 'Reset Password' }}
      </button>

    </form>

    <div class="login-footer">
      <a routerLink="/login">Back to Login</a>
    </div>

  </div>

</div>
